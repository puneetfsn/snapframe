<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SnapFrame</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#111118">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#111118;color:#eee;height:100dvh;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #222;background:#111118}
.logo-area{display:flex;align-items:center;gap:10px}
.logo-img{width:28px;height:28px;border-radius:7px;object-fit:cover;border:1px solid #333}
header h1{font-size:18px;font-weight:700;letter-spacing:-0.5px}
header h1 span{color:#8b5cf6}
#installBtn{background:#8b5cf6;border:none;color:#fff;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;display:none;margin-left:auto;margin-right:8px}
#newBtn{background:none;border:1px solid #333;color:#aaa;padding:6px 12px;border-radius:8px;font-size:13px;cursor:pointer;display:none}
#preview{display:flex;align-items:center;justify-content:center;padding:16px;min-height:0;overflow:hidden}
#canvas{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.5);display:none}
#dropzone{border:2px dashed #444;border-radius:16px;padding:40px 24px;text-align:center;cursor:pointer;max-width:360px;width:100%}
#dropzone.over{border-color:#8b5cf6;background:rgba(139,92,246,.08)}
#dropzone .big{font-size:44px;margin-bottom:10px}
#dropzone h2{font-size:17px;margin-bottom:6px}
#dropzone p{color:#aaa;font-size:13px;line-height:1.5}
#controls{background:#1a1a24;border-top:1px solid #222;padding:12px 16px calc(12px + env(safe-area-inset-bottom));max-height:46vh;overflow-y:auto;display:none}
.row{margin-bottom:14px}
.row label{display:block;font-size:11px;color:#aaa;margin-bottom:6px;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
input[type=range]{width:100%;accent-color:#8b5cf6}
.text-input{width:100%;background:#2a2a38;border:1px solid #3a3a4e;color:#fff;padding:10px;border-radius:8px;font-size:14px;outline:none}
.swatches{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px}
.swatch{flex:0 0 40px;height:40px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.swatch.active{border-color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 12px;border-radius:20px;background:#2a2a38;font-size:13px;cursor:pointer;border:1px solid transparent;user-select:none}
.chip.active{background:#8b5cf6;border-color:#a78bfa}
.actions{display:flex;gap:8px;margin-top:4px}
.btn{flex:1;padding:14px 8px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer}
.btn.primary{background:#8b5cf6;color:#fff}
.btn.secondary{background:#2a2a38;color:#eee}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#8b5cf6;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:999}
#toast.show{opacity:1}
@media(min-width:900px){
 body{grid-template-columns:1fr 340px;grid-template-rows:auto 1fr}
 header{grid-column:1/3}
 #controls{max-height:none;border-top:none;border-left:1px solid #222}
}
</style>
</head>
<body>

<header>
 <div class="logo-area">
  <img src="icon.png" class="logo-img" alt="SnapFrame">
  <h1>Snap<span>Frame</span></h1>
 </div>
 <button id="installBtn">📲 Install App</button>
 <button id="newBtn">+ New</button>
</header>

<main id="preview">
 <div id="dropzone">
  <div class="big">📸</div>
  <h2>Tap to pick a screenshot</h2>
  <p>or drag & drop here<br>or press <b>Ctrl+V / ⌘V</b> to paste</p>
 </div>
 <canvas id="canvas"></canvas>
 <input type="file" id="fileInput" accept="image/*" hidden>
</main>

<section id="controls">
 <div class="row"><label>Background</label><div class="swatches" id="swatches"></div></div>
 <div class="row">
  <label>Add Caption</label>
  <input type="text" id="caption" class="text-input" placeholder="Type title here..." value="">
 </div>
 <div class="row"><label>Frame</label>
  <div class="chips" id="frames">
   <div class="chip active" data-v="none">None</div>
   <div class="chip" data-v="mac">macOS Bar</div>
   <div class="chip" data-v="phone">iPhone Black</div>
  </div>
 </div>
 <div class="row"><label>Size</label>
  <div class="chips" id="ratios">
   <div class="chip active" data-v="auto">Auto</div>
   <div class="chip" data-v="1">1:1 Square</div>
   <div class="chip" data-v="0.8">4:5 Insta</div>
   <div class="chip" data-v="1.7778">16:9 X</div>
   <div class="chip" data-v="0.5625">9:16 Story</div>
  </div>
 </div>
 <div class="row"><label>Padding <span id="padV"></span></label><input type="range" id="pad" min="0" max="200" value="60"></div>
 <div class="row"><label>Corners <span id="radiusV"></span></label><input type="range" id="radius" min="0" max="80" value="20"></div>
 <div class="row"><label>Shadow <span id="shadowV"></span></label><input type="range" id="shadow" min="0" max="100" value="40"></div>
 <div class="actions">
  <button class="btn secondary" onclick="copyCanvas()">Copy</button>
  <button class="btn secondary" onclick="downloadCanvas()">Download</button>
  <button class="btn primary" onclick="shareCanvas()">Share</button>
 </div>
</section>

<div id="toast"></div>

<script>
const GRADIENTS=[['#667eea','#764ba2'],['#f093fb','#f5576c'],['#4facfe','#00f2fe'],['#43e97b','#38f9d7'],['#fa709a','#fee140'],['#30cfd0','#330867'],['#a8edea','#fed6e3'],['#ff9a9e','#fecfef'],['#0f0c29','#302b63'],['#ff6a00','#ee0979'],['#1e3c72','#2a5298'],['#f5f7fa','#c3cfe2'],['#ffffff','#ffffff'],['#000000','#000000']];
const state={img:null,grad:0,pad:60,radius:20,shadow:40,ratio:'auto',frame:'none',caption:''};
const $=id=>document.getElementById(id);
const canvas=$('canvas'),ctx=canvas.getContext('2d');
const dropzone=$('dropzone'),fileInput=$('fileInput');

let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e)=>{
 e.preventDefault(); deferredPrompt=e; $('installBtn').style.display='inline-block';
});
$('installBtn')?.addEventListener('click', async ()=>{
 if(deferredPrompt){ deferredPrompt.prompt(); const {outcome}=await deferredPrompt.userChoice; if(outcome==='accepted')$('installBtn').style.display='none'; deferredPrompt=null;}
});

function loadFile(file){
 if(!file||!file.type.startsWith('image/'))return;
 const url=URL.createObjectURL(file); const img=new Image();
 img.onload=()=>{state.img=img;URL.revokeObjectURL(url);showEditor();render();}; img.src=url;
}
function showEditor(){dropzone.style.display='none';canvas.style.display='block';$('controls').style.display='block';$('newBtn').style.display='inline-block';}
function reset(){state.img=null;fileInput.value='';$('caption').value='';state.caption='';dropzone.style.display='block';canvas.style.display='none';$('controls').style.display='none';$('newBtn').style.display='none';}

dropzone.addEventListener('click',()=>fileInput.click());
fileInput.addEventListener('change',e=>loadFile(e.target.files[0]));
$('newBtn').addEventListener('click',reset);
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();dropzone.classList.add('over');}));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();dropzone.classList.remove('over');}));
document.addEventListener('drop',e=>loadFile(e.dataTransfer.files[0]));
document.addEventListener('paste',e=>{ for(const item of e.clipboardData.items){if(item.type.startsWith('image/')){loadFile(item.getAsFile());break;}}});
$('caption').addEventListener('input',e=>{state.caption=e.target.value;render();});

const sw=$('swatches');
GRADIENTS.forEach((g,i)=>{ const d=document.createElement('div');d.className='swatch'+(i===0?' active':''); d.style.background=`linear-gradient(135deg,${g[0]},${g[1]})`; d.onclick=()=>{sw.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active'));d.classList.add('active');state.grad=i;render();}; sw.appendChild(d);});

function chipGroup(id,key){ const el=$(id); el.addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return; el.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));c.classList.add('active');state[key]=c.dataset.v;render();});}
chipGroup('frames','frame');chipGroup('ratios','ratio');

['pad','radius','shadow'].forEach(id=>{ const el=$(id); const up=()=>{state[id]=+el.value; $(id+'V').textContent=el.value; render();}; el.addEventListener('input',up); up();});

function roundRect(c,x,y,w,h,r){ r=Math.min(r,w/2,h/2); c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();}
function render(){
 const img=state.img; if(!img) return;
 let iw=img.naturalWidth, ih=img.naturalHeight;
 const f=Math.min(1,1800/Math.max(iw,ih)); iw=Math.round(iw*f); ih=Math.round(ih*f);
 const k=Math.max(iw,ih)/1000;
 const pad=state.pad*k, radius=state.radius*k, blur=state.shadow*k;
 const borderW=state.frame==='phone'?Math.round(iw*0.04):0;
 const barH=state.frame==='mac'?Math.round(Math.max(28,iw*0.045)):0;
 const cardW=iw+(borderW*2), cardH=ih+barH+(borderW*2);
 const textOffset=state.caption?Math.round(110*k):0;
 let outW=cardW+pad*2, outH=cardH+pad*2+textOffset;
 if(state.ratio!=='auto'){ const r=parseFloat(state.ratio); if(outW/outH>r) outH=outW/r; else outW=outH*r; }
 canvas.width=Math.round(outW); canvas.height=Math.round(outH);

 const g=GRADIENTS[state.grad];
 const grad=ctx.createLinearGradient(0,0,outW,outH); grad.addColorStop(0,g[0]); grad.addColorStop(1,g[1]);
 ctx.fillStyle=grad; ctx.fillRect(0,0,outW,outH);

 if(state.caption){
  ctx.fillStyle='#ffffff'; ctx.font=`bold ${Math.round(42*k)}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`; ctx.textAlign='center';
  ctx.fillText(state.caption, outW/2, pad+Math.round(45*k));
 }

 const x=(outW-cardW)/2, y=((outH-textOffset-cardH)/2)+textOffset;
 if(blur>0){ ctx.save(); ctx.shadowColor='rgba(0,0,0,.45)'; ctx.shadowBlur=blur; ctx.shadowOffsetY=blur*.4; ctx.fillStyle='#000'; roundRect(ctx,x,y,cardW,cardH,state.frame==='phone'?radius*1.5:radius); ctx.fill(); ctx.restore(); }

 ctx.save();
 if(state.frame==='phone'){
  roundRect(ctx,x,y,cardW,cardH,radius*1.5); ctx.clip();
  ctx.fillStyle='#0c0c0e'; ctx.fillRect(x,y,cardW,cardH);
  const diW=cardW*0.28, diH=cardH*0.03, diX=x+(cardW-diW)/2, diY=y+(cardH*0.02);
  ctx.fillStyle='#000'; roundRect(ctx,diX,diY,diW,diH,diH/2); ctx.fill();
 } else { roundRect(ctx,x,y,cardW,cardH,radius); ctx.clip(); }

 if(barH){
  ctx.fillStyle='#ececf1'; ctx.fillRect(x,y,cardW,barH);
  const r=barH*.17, cy=y+barH/2;
  ['#ff5f57','#febc2e','#28c840'].forEach((c,i)=>{ ctx.fillStyle=c; ctx.beginPath(); ctx.arc(x+barH*.55+i*r*2.9,cy,r,0,Math.PI*2); ctx.fill(); });
 }

 ctx.drawImage(img, x+borderW, y+barH+borderW, iw, ih);
 ctx.restore();
}

function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }
function getBlob(){ return new Promise(r=>canvas.toBlob(r,'image/png')); }
async function downloadCanvas(){ const b=await getBlob(); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='snapframe.png'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); toast('Saved!'); }
async function shareCanvas(){ const b=await getBlob(); const f=new File([b],'snapframe.png',{type:'image/png'}); if(navigator.canShare&&navigator.canShare({files:[f]})){ try{await navigator.share({files:[f],title:'SnapFrame'});}catch(e){} } else downloadCanvas(); }
async function copyCanvas(){ try{ const b=await getBlob(); await navigator.clipboard.write([new ClipboardItem({'image/png':b})]); toast('Copied!'); }catch(e){ toast('Use Download'); } }

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
